server:
  port: 8080

frontend:
  base-url: http://192.168.1.37:4200
  url-decoder: http://192.168.1.37:9000

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET}
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: http://192.168.1.37:9000
          predicates:
            - Path=/auth/**
        - id: loan-application
          uri: http://192.168.1.37:8083
          predicates:
            - Path=/loan-applications/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://192.168.1.37:8761/eureka
    instance:
      lease-renewal-interval-in-seconds: 10
      lease-expiration-duration-in-seconds: 30